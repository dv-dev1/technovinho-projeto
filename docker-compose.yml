services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-technovinho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-technovinho}
      POSTGRES_DB: ${POSTGRES_DB:-technovinho}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technovinho}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - technovinho-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-technovinho}:${POSTGRES_PASSWORD:-technovinho}@db:5432/${POSTGRES_DB:-technovinho}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      CANCEL_MIN_HOURS: ${CANCEL_MIN_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - technovinho-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    networks:
      - technovinho-net

networks:
  technovinho-net:

volumes:
  pgdata:
